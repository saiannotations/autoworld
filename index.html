<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: the 3D world is the page. Text sits straight on the scene over soft top and bottom scrims; only the controls get a glass chip. */
:root{
  --ink:#f7f4ee;
  --ink-2:rgba(247,244,238,.74);
  --ink-3:rgba(247,244,238,.52);
  --glass:rgba(18,20,22,.38);
  --glass-hi:rgba(255,255,255,.16);
  --line:rgba(255,255,255,.16);
  --accent:#f3c46b;
  --display:"Instrument Serif", "Iowan Old Style", Georgia, serif;
  --body:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#0d0f10;color:var(--ink);font-family:var(--body);font-size:13px;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none;outline:none}
.hud{position:fixed;inset:0;pointer-events:none;transition:opacity .5s ease}
.hud.off{opacity:0}
.hud.off *{pointer-events:none!important}
.scrim{position:absolute;left:0;right:0;pointer-events:none}
.scrim.top{top:0;height:190px;background:linear-gradient(180deg,rgba(8,10,12,.5),rgba(8,10,12,0))}
.scrim.bot{bottom:0;height:200px;background:linear-gradient(0deg,rgba(8,10,12,.5),rgba(8,10,12,0))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shadow{text-shadow:0 1px 14px rgba(0,0,0,.4)}

.progress{position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,255,255,.12)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,rgba(243,196,107,.5),var(--accent));transition:width .4s linear}

.tl{position:absolute;left:24px;top:calc(env(safe-area-inset-top,0px) + 22px);display:flex;flex-direction:column;gap:2px}
.brand{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.season{font-family:var(--display);font-style:italic;font-size:58px;line-height:1;letter-spacing:-.01em;margin-top:8px}
.sub{color:var(--ink-2);font-size:13px;margin-top:8px;display:flex;gap:6px 12px;flex-wrap:wrap}
.sub b{color:var(--ink);font-weight:500}

.tr{position:absolute;right:24px;top:calc(env(safe-area-inset-top,0px) + 22px);display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.cash{font-family:var(--mono);font-size:34px;font-weight:400;letter-spacing:-.02em;line-height:1}
.cash.bump{animation:bump .6s ease}
@keyframes bump{30%{color:var(--accent)}}
.stats{color:var(--ink-2);font-size:12.5px}
.best{color:var(--ink-3);font-size:11.5px}

.ticker{position:absolute;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:5px;max-width:min(460px,calc(100% - 48px))}
.ticker div{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .6s ease;animation:tin .5s ease}
.ticker em{font-style:normal;font-family:var(--mono);color:var(--accent)}
.ticker .neg{font-family:var(--mono);color:var(--ink-3)}
@keyframes tin{from{opacity:0;transform:translateY(4px)}}

.controls{position:absolute;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto;max-width:calc(100% - 48px)}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
.seg button,.chipbtn{all:unset;cursor:pointer;font-size:12px;font-weight:500;color:var(--ink-2);padding:6px 11px;border-radius:999px;white-space:nowrap;transition:background .2s,color .2s}
.seg button:hover,.chipbtn:hover{color:var(--ink)}
.seg button.on{background:var(--glass-hi);color:var(--ink)}
.seg button:focus-visible,.chipbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chipbtn{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.chipbtn.warn{color:#ffd9a8;border-color:rgba(243,196,107,.55)}

.botcard{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 76px);pointer-events:auto;display:flex;align-items:center;gap:14px;padding:10px 12px 10px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:calc(100% - 32px);box-sizing:border-box}
.botcard .sw{width:10px;height:10px;border-radius:50%;flex:none}
.botcard .nm{font-weight:600;font-size:14px}
.botcard .ds{color:var(--ink-2);font-size:12px}
.botcard .carry{display:flex;gap:3px}
.botcard .carry img{width:20px;height:20px}
.botcard .x{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;color:var(--ink-2);font-size:16px}
.botcard .x:hover,.botcard .x:focus-visible{background:var(--glass-hi);color:var(--ink)}

.summary{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at center,rgba(8,10,12,.58),rgba(8,10,12,.22));pointer-events:none;animation:fade .8s ease}
.summary .in{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:600px}
.summary .k{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-2)}
.summary h2{font-family:var(--display);font-style:italic;font-weight:400;font-size:64px;line-height:1;margin:0;text-wrap:balance}
.summary .row{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.summary .row div{display:flex;flex-direction:column;gap:2px}
.summary .row b{font-family:var(--mono);font-weight:400;font-size:24px}
.summary .row span{font-size:11.5px;color:var(--ink-2)}
.summary .next{color:var(--ink-2);margin-top:14px}
.summary .rec{color:var(--accent);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
@keyframes fade{from{opacity:0}}

.loader{position:fixed;inset:0;display:grid;place-items:center;background:#0d0f10;transition:opacity 1.4s ease;z-index:5}
.loader.done{opacity:0;pointer-events:none}
.loader p{font-family:var(--display);font-style:italic;font-size:28px;color:var(--ink-2);margin:0}
.showui{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);opacity:.45}
.showui:hover,.showui:focus-visible{opacity:1}

@media (max-width:760px){
  .tl{left:16px}.tr{right:16px}
  .season{font-size:40px}
  .cash{font-size:26px}
  .ticker{left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 116px)}
  .ticker div:not(:last-child){display:none}
  .controls{right:16px;left:16px;max-width:none;justify-content:center}
  .seg button,.chipbtn{padding:6px 9px;font-size:11.5px}
  .botcard{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
  .summary h2{font-size:44px}
}
@media (prefers-reduced-motion:reduce){.ticker div,.summary,.cash.bump{animation:none}}
</style>

<script>
(function(){
'use strict';
THREE.ColorManagement.legacyMode=false;
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=v=>{v=clamp(v,0,1);return v*v*(3-2*v)};

const fmt=n=>'$'+Math.round(n).toLocaleString('en-US');

function srand(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const store={get(k,d){try{const v=localStorage.getItem('robofarm-sim-'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('robofarm-sim-'+k,JSON.stringify(v));}catch(e){}}};

/* ================= economy & seasons ================= */
const ITEMS={
  tomato: {name:'Tomato',plural:'tomatoes',price:4,kind:'crop'},
  corn:   {name:'Corn',plural:'corn',price:3,kind:'crop'},
  rice:   {name:'Rice Bag',plural:'rice bags',price:12,kind:'crop'},

  trout:  {name:'Trout',plural:'trout',price:8,kind:'fish',col:0x8aa6b5,odds:0.33},
  salmon: {name:'Salmon',plural:'salmon',price:14,kind:'fish',col:0xd98764,odds:0.21},
  koi:    {name:'Golden Koi',plural:'golden koi',price:40,kind:'fish',col:0xe8a93a,odds:0.06},
};
const CROPS={
  tomato:{grow:9, px:-22,pz:-18,cols:4,rows:3,sp:2.6,maxRows:5},
  corn:  {grow:11,px:22,pz:-18,cols:4,rows:3,sp:2.6,maxRows:5},
  rice:  {grow:20,px:-22,pz:18,cols:4,rows:3,sp:2.6,maxRows:5},
  apple: {grow:14,px:22,pz:18,cols:3,rows:2,sp:4.2,maxRows:3},
};
const TYPES=Object.keys(CROPS), FISH=['catfish','trout','salmon','koi'], ALL=Object.keys(ITEMS);
const NOUN={tomato:'tomatoes',corn:'corn',rice:'rice',apple:'apples'};
const MAX_BOTS=16;
const SEASONS={
  spring:{name:'Spring',sub:'Windy, with leaves on the air',grow:1.1,cust:1.1,wind:1.0,rain:0,snow:0,wet:0,haze:0,frozen:0,cloud:0.26,turb:2.2,ray:2.6,mie:0.003,fog:0.0021,fogDay:0xbcd3e6,grass:0xc4d9a4,leaf:0xeaffd8,tint:[1.0,1.0,0.98],sat:1.0,exp:0.6,bloom:0.3,sun:2.6,hemi:0.45,grassH:1.0},
  summer:{name:'Summer',sub:'Hot and sunny, heat rising off the fields',grow:1.25,cust:1.25,wind:0.22,rain:0,snow:0,wet:0,haze:1,frozen:0,cloud:0.1,turb:2.0,ray:1.9,mie:0.003,fog:0.0018,fogDay:0xd2dadf,grass:0xd3c690,leaf:0xd6e8c0,tint:[1.05,1.0,0.92],sat:0.96,exp:0.55,bloom:0.45,sun:3.0,hemi:0.4,grassH:0.85},
  rainy:{name:'Rainy',sub:'Steady rainfall, crops drink it up',grow:1.4,cust:0.75,wind:0.6,rain:1,snow:0,wet:1,haze:0,frozen:0,cloud:0.95,turb:12,ray:0.45,mie:0.02,fog:0.0085,fogDay:0x8e9aa3,grass:0xaac58c,leaf:0xc9dcc0,tint:[0.93,0.98,1.05],sat:0.82,exp:0.85,bloom:0.22,sun:0.75,hemi:0.75,grassH:1.0},
  winter:{name:'Winter',sub:'Snowfall, and the pond freezes over',grow:0.55,cust:0.85,wind:0.4,rain:0,snow:1,wet:0,haze:0,frozen:1,cloud:0.78,turb:7,ray:0.9,mie:0.01,fog:0.0058,fogDay:0xc7d1db,grass:0xbcc0aa,leaf:0x9fb0a0,tint:[0.95,0.98,1.06],sat:0.85,exp:0.5,bloom:0.25,sun:1.5,hemi:0.55,grassH:0.3},
};
const ORDER=['spring','summer','rainy','winter'];
const DAY=360;

/* ================= icons ================= */
function drawIcon(ctx,type,x,y,r){
  ctx.save();ctx.translate(x,y);const it=ITEMS[type];
  if(type==='tomato'){
    ctx.fillStyle='#d23a2a';ctx.beginPath();ctx.ellipse(0,r*.12,r*.95,r*.82,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(-r*.38,-r*.05,r*.22,r*.13,-.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#3d8a35';for(let i=0;i<5;i++){const a=i/5*Math.PI*2-Math.PI/2;ctx.beginPath();ctx.ellipse(Math.cos(a)*r*.24,-r*.6+Math.sin(a)*r*.12,r*.24,r*.08,a,0,Math.PI*2);ctx.fill();}
  }else if(type==='corn'){
    ctx.fillStyle='#5a9a44';ctx.beginPath();ctx.moveTo(0,r*.95);ctx.quadraticCurveTo(-r*.85,r*.2,-r*.35,-r*.55);ctx.quadraticCurveTo(-r*.3,r*.3,0,r*.95);ctx.fill();
    ctx.fillStyle='#efc540';ctx.beginPath();ctx.ellipse(r*.05,-r*.05,r*.4,r*.9,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#d6a52a';for(let yy=-0.7;yy<=0.75;yy+=0.22)for(let xx=-0.22;xx<=0.32;xx+=0.18){ctx.beginPath();ctx.arc(r*xx,r*yy,r*.055,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#6ab152';ctx.beginPath();ctx.moveTo(0,r*.95);ctx.quadraticCurveTo(r*.9,r*.3,r*.45,-r*.45);ctx.quadraticCurveTo(r*.35,r*.35,0,r*.95);ctx.fill();
  }else if(type==='apple'){
    ctx.fillStyle='#c22a2f';ctx.beginPath();ctx.arc(-r*.32,r*.08,r*.62,0,Math.PI*2);ctx.arc(r*.32,r*.08,r*.62,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(0,r*.4,r*.7,r*.48,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.ellipse(-r*.45,-r*.05,r*.16,r*.24,-.4,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#6b4423';ctx.lineWidth=r*.12;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-r*.4);ctx.quadraticCurveTo(r*.05,-r*.75,r*.15,-r*.9);ctx.stroke();
    ctx.fillStyle='#4f9a3e';ctx.beginPath();ctx.ellipse(r*.38,-r*.72,r*.3,r*.13,-.5,0,Math.PI*2);ctx.fill();
  }else if(type==='rice'){
    ctx.fillStyle='#d9c393';ctx.beginPath();ctx.moveTo(-r*.55,-r*.5);ctx.quadraticCurveTo(-r*.95,r*.2,-r*.7,r*.85);ctx.lineTo(r*.7,r*.85);ctx.quadraticCurveTo(r*.95,r*.2,r*.55,-r*.5);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(-r*.3,-r*.55);ctx.lineTo(-r*.5,-r*.95);ctx.lineTo(0,-r*.75);ctx.lineTo(r*.5,-r*.95);ctx.lineTo(r*.3,-r*.55);ctx.closePath();ctx.fill();
    ctx.fillStyle='#8a5a2c';ctx.fillRect(-r*.5,-r*.62,r,r*.16);
  }else{
    ctx.rotate(-0.25);ctx.fillStyle=hex(it.col);
    ctx.beginPath();ctx.moveTo(r*.55,0);ctx.lineTo(r*.98,-r*.45);ctx.lineTo(r*.98,r*.45);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.ellipse(-r*.1,0,r*.72,r*.42,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(-r*.15,r*.12,r*.5,r*.14,0,0,Math.PI*2);ctx.fill();
    if(type==='koi'){ctx.fillStyle='#e2683c';ctx.beginPath();ctx.arc(-r*.3,-r*.1,r*.16,0,Math.PI*2);ctx.arc(r*.1,r*.08,r*.12,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle='#1b1a18';ctx.beginPath();ctx.arc(-r*.52,-r*.08,r*.07,0,Math.PI*2);ctx.fill();
  }

const ICON_URL={};
for(const t of ALL){const c=document.createElement('canvas');c.width=c.height=64;drawIcon(c.getContext('2d'),t,32,33,26);ICON_URL[t]=c.toDataURL();}

/* ================= renderer & post ================= */
const isLow=matchMedia('(pointer:coarse)').matches||Math.min(innerWidth,innerHeight)<600;
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
const DPR=Math.min(window.devicePixelRatio||1,isLow?1.5:2);
let quality=0;const QL=[DPR,Math.min(DPR,1.5),Math.min(DPR,1.15),0.85];
renderer.setPixelRatio(QL[0]);renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.NoToneMapping;renderer.outputEncoding=THREE.LinearEncoding;
$('#stage').appendChild(renderer.domElement);
const ANISO=Math.min(8,renderer.capabilities.getMaxAnisotropy());
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.3,3000);
camera.position.set(58,40,52);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,-6);controls.enableDamping=true;controls.dampingFactor=0.07;
controls.maxPolarAngle=1.45;controls.minDistance=5;controls.maxDistance=180;

const rt=new THREE.WebGLRenderTarget(innerWidth*QL[0],innerHeight*QL[0],{type:THREE.HalfFloatType,samples:renderer.capabilities.isWebGL2?4:0});
const composer=new THREE.EffectComposer(renderer,rt);

  const n=(x,y,per)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const w=a=>((a%per)+per)%per;
    const H=(i,j)=>v[p[p[w(i)&255]+(w(j)&255)]];const u=xf*xf*(3-2*xf),t=yf*yf*(3-2*yf);

const STALL={x0:-5.9,x1:5.9,z0:-3.6,z1:2.9};
const onPier=(x,z)=>Math.abs(x)<1.1&&z>-27.8&&z<-22.6;
const inPond=(x,z,pad)=>{const dx=(x-PD.cx)/(PD.rx+(pad||0)),dz=(z-PD.cz)/(PD.rz+(pad||0));return dx*dx+dz*dz<1&&!onPier(x,z);};
function hitsStall(ax,az,bx,bz){for(let i=1;i<24;i++){const t=i/24,x=ax+(bx-ax)*t,z=az+(bz-az)*t;if(x>STALL.x0&&x<STALL.x1&&z>STALL.z0&&z<STALL.z1)return true;}return false;}

const pondAng=(x,z)=>Math.atan2((z-PD.cz)/PD.rz,(x-PD.cx)/PD.rx);
function routePond(ax,az,bx,bz){if(!hitsPond(ax,az,bx,bz))return[{x:bx,z:bz}];const a0=pondAng(ax,az),a1=pondAng(bx,bz);const d=Math.atan2(Math.sin(a1-a0),Math.cos(a1-a0));const n=Math.max(1,Math.ceil(Math.abs(d)/0.5));const out=[];for(let i=1;i<n;i++){const a=a0+d*i/n;out.push({x:PD.cx+Math.cos(a)*(PD.rx+1.6),z:PD.cz+Math.sin(a)*(PD.rz+1.6)});}out.push({x:bx,z:bz});return out;}

function setTask(b,t){const p=b.group.position;t.phase='move';t.t=0;t.path=route(p.x,p.z,t.tx,t.tz);b.task=t;return t;}
function releaseTask(b){const t=b.task;if(!t)return;if(t.slot&&t.slot.reserved===b)t.slot.reserved=null;if(t.cust&&t.cust.reservedBy===b)t.cust.reservedBy=null;if(t.spot&&t.spot.reserved===b&&!b.fish)t.spot.reserved=null;b.task=null;}
function canSellTo(b,c){if(!c||c.state!=='wait')return false;for(const it of b.carry)if(c.wish[it]>0&&c.wallet>=ITEMS[it].price)return true;return false;}

function nearestSlot(b,state){const p=b.group.position;let best=null,bd=1e9;for(const s of slots){if(s.state!==state||s.reserved)continue;const d=Math.hypot(s.x-p.x,s.z-p.z)+Math.random()*6;if(d<bd){bd=d;best=s;}}return best;}

function chooseTask(b){

  if(b.carry.length&&(b.waitTime>18||(b.carry.includes('koi')&&!findCustomer(b)))){const x=clamp(b.group.position.x,-4,4);return setTask(b,{type:'wholesale',tx:x,tz:3.4,lx:x,lz:0});}
  if(full){const c=findCustomer(b);if(c)return sellTask(b,c);}
  if(!full&&farm){const s=nearestSlot(b,'ripe');if(s)return slotTask(b,s,'harvest');}
  if(!full&&b.job==='fish'){const s=freeSpot(b);if(s)return fishTask(b,s);}
  if(b.carry.length){const c=findCustomer(b);if(c)return sellTask(b,c);}
  if(farm){const e=nearestSlot(b,'empty');if(e)return slotTask(b,e,'plant');}
  if(!full&&fish){const s=freeSpot(b);if(s)return fishTask(b,s);}
  if(b.carry.length)return setTask(b,{type:'wait',tx:rand(-4.2,4.2),tz:3.5,lx:0,lz:10});

}
function slotTask(b,s,type){s.reserved=b;const st=standNear(b,s.x,s.z,s.type==='apple'?1.7:1.05);return setTask(b,{type,slot:s,tx:st.x,tz:st.z,lx:s.x,lz:s.z});}
function sellTask(b,c){c.reservedBy=b;const cp=c.g.position;const st=standNear(b,cp.x,cp.z,1.2);return setTask(b,{type:'sell',cust:c,tx:st.x,tz:st.z,lx:cp.x,lz:cp.z});}
function fishTask(b,s){s.reserved=b;return setTask(b,{type:'fish',spot:s,tx:s.x,tz:s.z,lx:s.lx,lz:s.lz});}
function taskValid(b,t){
  if(t.type==='harvest')return t.slot.state==='ripe'&&t.slot.reserved===b&&b.carry.length<b.cap;
  if(t.type==='plant')return t.slot.state==='empty'&&t.slot.reserved===b;
  if(t.type==='sell')return customers.includes(t.cust)&&t.cust.state==='wait'&&t.cust.reservedBy===b;

function turnTo(b,tx,tz,dt,rate){const p=b.group.position;const want=Math.atan2(tx-p.x,tz-p.z);const d=Math.atan2(Math.sin(want-b.yaw),Math.cos(want-b.yaw));b.yaw+=d*Math.min(1,dt*(rate||10));}

const puffs=[];const puffG=sph(0.18,8,6);
function puff(x,z,n){for(let i=0;i<n;i++){if(puffs.length>60)break;const m=new THREE.Mesh(puffG,new THREE.MeshStandardMaterial({color:E.snowCover>0.5?0xe8eef2:0x7a5a3a,roughness:1,transparent:true,opacity:0.5,depthWrite:false}));m.position.set(x+rand(-.3,.3),0.35,z+rand(-.3,.3));scene.add(m);puffs.push({m,v:new THREE.Vector3(rand(-.6,.6),rand(.6,1.4),rand(-.6,.6)),life:0});}}
function doHarvest(b,s){s.state='empty';s.t=0;s.reserved=null;b.carry.push(s.type);rebuildCarry(b);}
function doPlant(b,s){s.state='growing';s.t=0.02;s.reserved=null;puff(s.x,s.z,4);}
function doSale(b,c){
  let total=0,n=0;const sold={};
  for(let i=b.carry.length-1;i>=0;i--){const it=b.carry[i];const pr=ITEMS[it].price;if(c.wish[it]>0&&c.wallet>=pr){c.wish[it]--;c.wallet-=pr;total+=pr;n++;sold[it]=(sold[it]||0)+1;b.carry.splice(i,1);G.sold[it]++;}}

  const txt=Object.keys(sold).map(k=>sold[k]+' '+(sold[k]>1?ITEMS[k].plural:ITEMS[k].name.toLowerCase())).join(', ');
  tick(`${b.name} sold ${txt} <em>+$${total}</em>`);coinBurst(c.g.position.x,c.g.position.z);gainXp(b,n);
}
function wholesale(b){let total=0;for(const it of b.carry){total+=ITEMS[it].price*(it==='koi'?1:ITEMS[it].kind==='fish'?0.7:0.5);G.sold[it]++;}
  total=Math.round(total);const n=b.carry.length;b.carry=[];rebuildCarry(b);b.waitTime=0;earn(total);b.earned+=total;b.sold+=n;
  tick(`${b.name} sold extra stock to the stall <em>+$${total}</em>`);gainXp(b,Math.ceil(n/2));}
function gainXp(b,n){b.xp+=n;while(b.xp>=xpNeed(b.level)){b.xp-=xpNeed(b.level);b.level++;botStats(b);b.pop=1;tick(`${b.name} upgraded to level ${b.level}`);}}
function bobberPos(b,out,pier){const p=b.group.position;const d=pier?3.4:3.0;return out.set(p.x+Math.sin(b.yaw)*d,0.2,p.z+Math.cos(b.yaw)*d);}

function cancelFish(b){if(!b.fish)return;if(b.fish.spot.reserved===b)b.fish.spot.reserved=null;b.fish=null;}
const flying=[];
function updateFishing(b,dt){const f=b.fish;f.t+=dt;turnTo(b,f.spot.lx,f.spot.lz,dt,6);if(f.t<f.dur)return;
  const bp=bobberPos(b,tmpV2,f.spot.pier).clone();cancelFish(b);

const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
function updateBot(b,dt,time){

  if(t.type==='wait')b.waitTime+=dt;
  if(!taskValid(b,t))releaseTask(b);

    if(t.type==='harvest'&&t.t>=0.9){doHarvest(b,t.slot);releaseTask(b);}
    else if(t.type==='plant'&&t.t>=1.1){doPlant(b,t.slot);releaseTask(b);}
    else if(t.type==='sell'){if(!t.done&&t.t>=0.45){t.done=true;doSale(b,t.cust);}if(t.t>=0.9)releaseTask(b);}
    else if(t.type==='wholesale'){if(!t.done&&t.t>=0.5){t.done=true;wholesale(b);}if(t.t>=0.9)releaseTask(b);}
    else if(t.type==='fish'){acting=null;if(!t.started){t.started=true;if(!startFishing(b,t.spot))releaseTask(b);}else if(!b.fish)releaseTask(b);}
    else if(t.type==='wait'&&t.t>=1.2)releaseTask(b);
    else if(t.type==='idle'&&t.t>=t.dur)releaseTask(b);}
  if(b.fish){updateFishing(b,dt);if(b.fish)acting='fish';}
  b.actCode=acting||'';

}

  b.rod.visible=b.bobber.visible=b.line.visible=fishing;b.hole.visible=fishing&&E.frozen>0.5;
  const k=Math.min(1,dt*10);const set=(a,s,e)=>{a.sh.rotation.x+=(s-a.sh.rotation.x)*k;a.el.rotation.x+=(e-a.el.rotation.x)*k;};

  else if(acting==='harvest'||acting==='plant'){const s=Math.sin(time*10+b.id);set(L,-1.3+s*0.35,-0.7-s*0.2);set(R,-1.3-s*0.35,-0.7+s*0.2);b.head.rotation.x=0.3;}

  cTmp.copy(ECOL.fogDay).lerp(cDusk,dusk*0.45*(1-E.cloud*0.7)).lerp(cNight,night);
  scene.fog.color.copy(cTmp);scene.fog.density=E.fog*(1+night*0.4);
  cloudMat.uniforms.uCover.value=E.cloud*0.85+0.08;
  cloudMat.uniforms.uLit.value.setRGB(1,0.97,0.93).lerp(cTmp2.setRGB(1,0.7,0.5),dusk*0.6).multiplyScalar(lerp(0.06,1.4,daylight)*lerp(1,0.6,E.cloud));
  cloudMat.uniforms.uShade.value.copy(cloudMat.uniforms.uLit.value).multiplyScalar(lerp(0.75,0.5,E.cloud));
  cloudMat.uniforms.uWindOff.value.x+=dt*0.004*(0.4+E.wind);
  starMat.opacity=night*(1-E.cloud*0.9);moon.material.opacity=night*(1-E.cloud*0.8);moon.position.copy(tmpV.set(-sunDir.x,Math.max(0.3,-sunDir.y),-sunDir.z).normalize().multiplyScalar(1200));
  const lamp=smooth((0.45-daylight)/0.35)+E.rain*0.15*daylight;lampLights.forEach(l=>l.intensity=lamp*2.6);bulbMat.emissiveIntensity=lamp*4;headlightMat.emissiveIntensity=0.4+lamp*6;
  MAT.ground.color.copy(ECOL.grass);MAT.orchard.color.copy(ECOL.grass);grassMat.color.copy(ECOL.grass);treeLeafMat.color.copy(ECOL.leaf);
  U.uWind.value=E.wind;U.uSnow.value=E.snowCover;U.uWet.value=E.wet;U.uGrassH.value=E.grassH;
  setCrownScale(lerp(1,0.6,E.snowCover));setBlossom(E.blossom);
  const fr=E.frozen;water.color.setRGB(0.03,0.1,0.13).lerp(cTmp.setRGB(0.75,0.83,0.88),fr);water.roughness=lerp(0.08,0.3,fr);water.envMapIntensity=lerp(0.85,0.5,fr);water.normalScale.setScalar(lerp(0.35+E.wind*0.15,0.05,fr));water.opacity=lerp(0.9,1,fr);
  lilyMesh.visible=fr<0.5;
  WU.uOff1.value.x+=dt*0.012*(1-fr)*(0.5+E.wind);WU.uOff1.value.y+=dt*0.007*(1-fr);WU.uOff2.value.x-=dt*0.009*(1-fr);WU.uOff2.value.y+=dt*0.011*(1-fr)*(0.5+E.wind);
  if(E.rain>0.6){lightT-=dt;if(lightT<=0){lightning=1;lightT=rand(9,22);}}lightning=Math.max(0,lightning-dt*3.2);const flash=lightning>0?Math.max(0,Math.sin(lightning*20))*lightning:0;
  grade.uniforms.uExp.value=E.exp*lerp(1.35,1,daylight);grade.uniforms.uSat.value=E.sat*lerp(0.7,1,daylight);grade.uniforms.uHaze.value=E.haze*daylight;grade.uniforms.uFlash.value=flash*0.35;
  grade.uniforms.uTint.value.set(E.tint[0],E.tint[1],E.tint[2]).lerp(_v.set(0.82,0.9,1.15),night*0.8);
  bloom.strength=E.bloom*(1+night*0.6);
  const want={rain:E.rain,snow:E.snow,leaves:E.leafFall,dust:E.haze*daylight};
  for(const k in PARTICLES){const p=PARTICLES[k];const u=p.material.uniforms;u.uOpacity.value=lerp(u.uOpacity.value,clamp(want[k]||0,0,1),1-Math.exp(-dt*0.8));p.visible=u.uOpacity.value>0.01;
    u.uCenter.value.set(camera.position.x*0.5+controls.target.x*0.5,0,camera.position.z*0.5+controls.target.z*0.5);u.uLight.value=lerp(0.25,1,daylight)+flash;u.uPR.value=renderer.getPixelRatio();}
  windBlades.rotation.z-=dt*(0.4+E.wind*2.4);
  envT+=dt;const cloudQ=Math.round(E.cloud*20);
  if(envT>1.5&&(sunDir.distanceTo(lastEnvSun)>0.03||cloudQ!==lastEnvCloud)){envT=0;lastEnvSun.copy(sunDir);lastEnvCloud=cloudQ;refreshEnv();}
}

/* ================= camera director ================= */
let camMode='cinematic',followBot=null,shot=null,shotT=0,shotIdx=-1;
const camP=new THREE.Vector3(),camT=new THREE.Vector3();
const SHOTS=[
  {dur:15,f:(t,s)=>{const a=s.a+t*0.035;return[Math.cos(a)*62,36,Math.sin(a)*62-6,0,0,-6];}},
  {dur:13,bot:true},
  {dur:12,f:(t)=>[-15+t*1.0,5.2,23,-2+t*0.3,1.4,6]},
  {dur:12,f:(t,s)=>{const a=s.a+t*0.04;return[Math.sin(a)*19,6.5,-31+Math.cos(a)*15,0,0.4,-31];}},
  {dur:12,f:(t,s)=>{const p=CROPS[s.crop];const d=Math.sign(p.pz);return[p.px-9+t*1.4,3.4,p.pz+d*9,p.px,0.8,p.pz-d*1];}},
  {dur:13,bot:true},
  {dur:13,f:(t)=>[6+t*0.3,2.8,52-t*1.1,0,4.5,-10]},
  {dur:12,f:(t,s)=>{const a=s.a+t*0.03;return[-39+Math.cos(a)*24,9,-30+Math.sin(a)*24,-37,3,-36];}},
];
function nextShot(){shotIdx=(shotIdx+1)%SHOTS.length;const S=SHOTS[shotIdx];const busy=bots.filter(b=>b.task&&b.task.type!=='idle');shot={def:S,a:Math.random()*Math.PI*2,crop:pick(TYPES),bot:S.bot?pick(busy.length?busy:bots):null};shotT=0;}
const chaseArr=[0,0,0,0,0,0];
function chase(b){const p=b.group.position;chaseArr[0]=p.x-Math.sin(b.yaw)*7.5+Math.cos(b.yaw)*1.8;chaseArr[1]=3.6;chaseArr[2]=p.z-Math.cos(b.yaw)*7.5-Math.sin(b.yaw)*1.8;chaseArr[3]=p.x;chaseArr[4]=1.1;chaseArr[5]=p.z;return chaseArr;}
function updateCamera(dt){
  if(camMode==='follow'&&followBot){const p=followBot.group.position;tmpV.set(p.x,1.0,p.z).sub(controls.target);const k=Math.min(1,dt*4);controls.target.addScaledVector(tmpV,k);camera.position.addScaledVector(tmpV,k);return;}
  if(camMode!=='cinematic')return;
  if(!shot)nextShot();shotT+=dt;if(shotT>shot.def.dur)nextShot();
  let a;if(shot.def.bot){if(!shot.bot||!bots.includes(shot.bot))shot.bot=bots[0];if(!shot.bot)return;a=chase(shot.bot);}else a=shot.def.f(shotT,shot);
  camP.set(a[0],a[1],a[2]);camT.set(a[3],a[4],a[5]);
  const k=1-Math.exp(-dt*(shot.def.bot?1.4:0.7));camera.position.lerp(camP,k);controls.target.lerp(camT,k);
}
function setCam(m){camMode=m;$('#btnCam').textContent=m==='cinematic'?'Cinematic':'Free camera';if(m!=='follow'){followBot=null;$('#botcard').hidden=true;}if(m==='cinematic')nextShot();}
function stopFollow(){followBot=null;$('#botcard').hidden=true;if(camMode==='follow')setCam('cinematic');}
controls.addEventListener('start',()=>{if(camMode==='cinematic')setCam('free');});
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{downAt={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointerup',e=>{if(!downAt)return;const moved=Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y);downAt=null;if(moved>6)return;
  mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(bots.map(b=>b.group),true);
  if(hits.length){let o=hits[0].object;while(o&&!o.userData.bot)o=o.parent;if(o){followBot=o.userData.bot;camMode='follow';$('#btnCam').textContent='Following';$('#botcard').hidden=false;updateBotCard();}}});
const keys=new Set();
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='h'){toggleUI();return;}if(k==='escape'){stopFollow();return;}
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){keys.add(k);if(camMode!=='free')setCam('free');e.preventDefault();}});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
function freeKeys(dt){if(!keys.size)return;camera.getWorldDirection(tmpV);tmpV.y=0;tmpV.normalize();const fx=tmpV.x,fz=tmpV.z;
  const ix=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),iz=(keys.has('w')||keys.has('arrowup')?1:0)-(keys.has('s')||keys.has('arrowdown')?1:0);
  const sp=camera.position.distanceTo(controls.target)*0.8*dt;const dx=(fx*iz-fz*ix)*sp,dz=(fz*iz+fx*ix)*sp;controls.target.x+=dx;controls.target.z+=dz;camera.position.x+=dx;camera.position.z+=dz;}

/* ================= UI ================= */
const ticker=$('#ticker');const cashEl=$('#cash');
function tick(html){const d=document.createElement('div');d.innerHTML=html;ticker.appendChild(d);while(ticker.children.length>4)ticker.firstChild.remove();const a=[...ticker.children];a.forEach((c,i)=>c.style.opacity=String(0.3+0.7*(i+1)/a.length));}
let bumpT=0;function bumpCash(){const n=performance.now();if(n-bumpT<400)return;bumpT=n;cashEl.classList.remove('bump');void cashEl.offsetWidth;cashEl.classList.add('bump');}
function setSeg(id,v){document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on',b.dataset.v===String(v)));}
const STATE={harvest:'harvesting',plant:'planting',sell:'selling to a shopper',wholesale:'selling to the stall',fish:'heading to the pond',wait:'waiting for a buyer',idle:'charging at the dock'};
function updateBotCard(){const b=followBot;if(!b)return;$('#bcSw').style.background=hex(b.color);$('#bcName').textContent=b.name+' · level '+b.level;
  const state=b.fish?'fishing':b.task?STATE[b.task.type]:'thinking';
  $('#bcDesc').textContent=(b.job==='fish'?'Fisher':'Farmer')+', '+state+' · earned '+fmt(b.earned);
  const key=b.carry.join(',');const c=$('#bcCarry');if(c.dataset.k!==key){c.dataset.k=key;c.innerHTML=b.carry.map(t=>`<img src="${ICON_URL[t]}" alt="${ITEMS[t].name}">`).join('');}}
function updateUI(){
  const S=SEASONS[season];$('#seasonName').textContent=S.name;$('#seasonSub').textContent=S.sub;
  $('#day').textContent=dayNo;const h=((G.hour%24)+24)%24;const mins=Math.floor(h*60);$('#clock').textContent=String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
  cashEl.textContent=fmt(G.cash);$('#sBots').textContent=bots.length;$('#sShop').textContent=customers.filter(c=>c.state!=='leave').length;$('#sSold').textContent=Object.values(G.sold).reduce((a,b)=>a+b,0);
  $('#best').textContent=best?'Best day '+fmt(best):'';
  $('#prog').style.width=(clamp((G.hour-5.5)/24,0,1)*100)+'%';
  updateBotCard();
}
document.querySelectorAll('#segSeason button').forEach(b=>b.addEventListener('click',()=>{seasonPref=b.dataset.v;store.set('season',seasonPref);setSeg('segSeason',seasonPref);
  if(seasonPref!=='auto'&&seasonPref!==season){season=seasonPref;tick(`The season turns to ${SEASONS[season].name.toLowerCase()}`);}}));
document.querySelectorAll('#segSpeed button').forEach(b=>b.addEventListener('click',()=>{speed=+b.dataset.v;store.set('speed',speed);setSeg('segSpeed',speed);}));
$('#btnCam').addEventListener('click',()=>setCam(camMode==='cinematic'?'free':'cinematic'));
$('#bcClose').addEventListener('click',stopFollow);
function toggleUI(){const off=!$('#hud').classList.contains('off');$('#hud').classList.toggle('off',off);$('#btnShow').hidden=!off;}
$('#btnHide').addEventListener('click',toggleUI);$('#btnShow').addEventListener('click',toggleUI);
let resetArm=0;
$('#btnReset').addEventListener('click',()=>{const b=$('#btnReset');
  if(resetArm&&Date.now()-resetArm<3000){resetArm=0;b.textContent='Reset day';b.classList.remove('warn');resetFarm();return;}
  resetArm=Date.now();b.textContent='Tap again to reset';b.classList.add('warn');
  setTimeout(()=>{if(resetArm&&Date.now()-resetArm>=2900){resetArm=0;b.textContent='Reset day';b.classList.remove('warn');}},3000);});
setSeg('segSeason',seasonPref);setSeg('segSpeed',speed);

/* ================= simulation ================= */
function simStep(dt,time){
  if(G.phase==='run'){
    const hr=((G.hour%24)+24)%24;G.hour+=dt*((hr>=5.5&&hr<20.5)?15/(0.8*DAY):9/(0.2*DAY));
    if(G.hour>=29.5)endDay();
    G.mgrT-=dt;if(G.mgrT<=0){G.mgrT=1.5;manager();}
    spawnCustomers(dt);
  }
  const gm=(1+0.2*G.fert)*E.grow;
  for(const s of slots)if(s.state==='growing'){s.t+=dt*gm/CROPS[s.type].grow;if(s.t>=1){s.t=1;s.state='ripe';}}
  for(let i=0;i<bots.length;i++)updateBot(bots[i],dt,time);
  separate();
  for(let i=customers.length-1;i>=0;i--)updateCustomer(customers[i],dt);
}
let qAcc=0,qN=0,qT=0,qGood=0;
function applyQuality(){const pr=QL[quality];renderer.setPixelRatio(pr);composer.setPixelRatio(pr);composer.setSize(innerWidth,innerHeight);bloom.enabled=quality<3;}
function qualityTick(ms){qAcc+=ms;qN++;qT+=ms;if(qT<2500)return;const avg=qAcc/qN;qAcc=qN=qT=0;
  if(avg>24&&quality<QL.length-1){quality++;qGood=0;applyQuality();}else if(avg<13&&quality>0){if(++qGood>=3){quality--;qGood=0;applyQuality();}}else qGood=0;}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);grade.uniforms.uRes.value.set(innerWidth,innerHeight);});

freshState();snapEnv();resetFarm();applyEnv(0.016);updateCrops(0);updateUI();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>customers.forEach(drawBubble));
let last=performance.now(),time=0,uiT=0,cropT=0,frames=0;
function frame(now){
  requestAnimationFrame(frame);
  const raw=Math.min(0.1,(now-last)/1000);last=now;const rdt=Math.min(raw,0.05);
  if(frames>5)qualityTick(raw*1000);
  let dt=rdt*speed;time+=dt;U.uTime.value+=rdt;grade.uniforms.uTime.value=U.uTime.value;
  while(dt>1e-6){const s=Math.min(dt,0.05);simStep(s,time);dt-=s;}
  blendEnv(rdt*speed);applyEnv(rdt*speed);
  updatePond(rdt*speed,time);updateFx(rdt*speed);
  cropT+=rdt;if(cropT>0.08){cropT=0;updateCrops(time);}
  const bo=lerp(0.4,1,daylight);for(const c of customers)c.bubble.material.opacity=bo;
  updateCamera(rdt);freeKeys(rdt);controls.update();
  composer.render();
  uiT+=rdt;if(uiT>0.25){uiT=0;updateUI();}
  if(++frames===3)$('#loader').classList.add('done');
}
requestAnimationFrame(frame);
})();
</script>
